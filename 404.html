<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>MediMitra - AI Medical Assistant</title>
    <script type="text/javascript">
      // Clean SPA fallback redirect for GitHub Pages
      (function() {
        var path = window.location.pathname;
        var isDocs = path.indexOf('/docs') !== -1;
        var repoMatch = path.match(/^\/([^\/]+)/);
        var repoName = (repoMatch && window.location.hostname.indexOf('github.io') !== -1) ? '/' + repoMatch[1] : '';
        var target = repoName + (isDocs ? '/docs/' : '/');
        window.location.replace(target);
      })();
    </script>
  </head>
  <body style="font-family: sans-serif; background-color: #f8fafc; color: #334155; padding: 40px; text-align: center;">
    <h2>Redirecting to MediMitra...</h2>
    <p>If you are not redirected automatically, <a href="./" style="color: #0d9488;">click here to open MediMitra</a>.</p>
  </body>
</html>
