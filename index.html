<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediMitra - AI Medical Assistant & Health Triage</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" href="./favicon.png" />
    <meta name="description" content="MediMitra: Intelligent medical symptom triage, clinical intake checkup, OTC medicine suggestions, doctor referrals, and automated health reports." />
    <meta property="og:title" content="MediMitra - AI Medical Assistant & Health Triage" />
    <meta property="og:description" content="MediMitra: Intelligent medical symptom triage, clinical intake checkup, OTC medicine suggestions, doctor referrals, and automated health reports." />
    <meta property="og:image" content="./assets/aistudio/image_8f9dd967.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #334155;">
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
          <div style="width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #0d9488, #059669); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 16px;">+</div>
          <span style="font-size: 20px; font-weight: 700; color: #0f172a; letter-spacing: -0.5px;">MediMitra</span>
        </div>
        <p style="font-size: 13px; color: #64748b; margin: 0;">Loading medical assistant...</p>
      </div>
    </div>
    <script>
      // Gracefully prevent unhandled rejections and errors from Vite dev-mode WebSocket in sandbox
      window.addEventListener('unhandledrejection', function(e) {
        var reasonStr = (e && e.reason && (e.reason.message || e.reason.stack || String(e.reason))) || '';
        if (reasonStr.indexOf('WebSocket') !== -1 || reasonStr.indexOf('websocket') !== -1) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function(e) {
        var msg = (e && (e.message || String(e))) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('[vite]') !== -1) {
          e.preventDefault();
        }
      });

      // Fallback for GitHub Pages "Deploy from branch -> / (root)":
      // Since raw .tsx files cannot execute directly in browsers without a build step,
      // redirect to the pre-compiled /docs/ bundle if served statically from GitHub Pages root.
      (function() {
        var isGitHubPages = window.location.hostname.indexOf('github.io') !== -1;
        var isDocsPath = window.location.pathname.indexOf('/docs') !== -1;
        var isUncompiled = document.querySelector('script[src*="main.tsx"]');
        if (isGitHubPages && !isDocsPath && isUncompiled) {
          var p = window.location.pathname;
          if (!p.endsWith('/')) p += '/';
          window.location.replace(p + 'docs/' + window.location.search + window.location.hash);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
